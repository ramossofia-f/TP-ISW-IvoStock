[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivostock"
version = "0.1.0"
description = "Sincronización de inventario entre N fuentes de stock y K tiendas de MercadoLibre"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ivostock = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: requiere PostgreSQL (variable IVOSTOCK_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# El comparador actual se reescribe en P3 contra el estado vigente (ADR-0002).
"src/ivostock/comparador/*" = ["E501", "UP", "I"]
