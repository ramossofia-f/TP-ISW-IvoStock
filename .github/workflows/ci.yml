name: CI
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivostock
          POSTGRES_PASSWORD: ivostock-ci
          POSTGRES_DB: motor_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ivostock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IVOSTOCK_TEST_DATABASE_URL: postgresql://ivostock:ivostock-ci@localhost:5432/motor_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Análisis estático
        run: ruff check src tests
      - name: Tests (incluye integración con PostgreSQL)
        run: pytest

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (RNF-07)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
